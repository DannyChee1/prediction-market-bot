[package]
name = "polybot-arb"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "polybot-arb"
path = "src/main.rs"

[dependencies]
polyfill-rs = { git = "https://github.com/floor-licker/polyfill-rs", features = ["stream"] }
tokio = { version = "1.41", features = ["full"] }
tokio-tungstenite = { version = "0.21", features = ["native-tls"] }
futures-util = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rust_decimal = "1.36"
alloy-primitives = "1"
alloy-sol-types = "1"
alloy-signer = "1"
alloy-signer-local = "1"
clap = { version = "4", features = ["derive"] }
reqwest = { version = "0.12", features = ["json", "rustls-tls"], default-features = false }
chrono = { version = "0.4", features = ["serde"] }
dotenvy = "0.15"
anyhow = "1"
hmac = "0.12"
sha2 = "0.10"
base64 = "0.22"

[profile.release]
lto = true
codegen-units = 1
