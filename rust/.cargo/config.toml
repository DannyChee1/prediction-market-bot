[target.x86_64-pc-windows-gnu]
rustflags = ["-C", "link-self-contained=y"]

# target-cpu=native makes rustc emit instructions tuned for the host CPU
# (AVX2/AVX512/BMI2/etc. where available). Biggest gains are in crypto hot
# paths (keccak256, sha256) and any SIMD-vectorizable pure-Rust loops
# (price ring scans, sonic-rs parsing). Binary becomes tied to the CPU
# family it's built on — that's intentional since we build on the VPS.
#
# Scoped to release because debug profile benefits are negligible and we
# want fast debug builds locally.
[target.x86_64-unknown-linux-gnu]
rustflags = ["-C", "target-cpu=native"]

[target.aarch64-apple-darwin]
rustflags = ["-C", "target-cpu=native"]

[target.x86_64-apple-darwin]
rustflags = ["-C", "target-cpu=native"]
